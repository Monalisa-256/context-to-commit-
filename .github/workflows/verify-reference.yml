name: Verify reference example

on:
  push:
    paths:
      - 'MASTERPLAN.md'
      - 'TESTING.md'
      - 'examples/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/verify-reference.yml'
  pull_request:
    paths:
      - 'MASTERPLAN.md'
      - 'TESTING.md'
      - 'examples/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/verify-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source and masterplan agree
        run: python tools/sync_reference.py
      - name: Run corrected reading queue tests
        working-directory: examples/reading_queue
        run: python -m unittest discover -s tests -v
      - name: Run reference and publication tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
